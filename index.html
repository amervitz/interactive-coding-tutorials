<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Modules Interactive Tutorial</title>
  <link rel="stylesheet" href="./vendor/monaco/vs/editor/editor.main.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>JavaScript Modules Tutorial</h1>
    <div class="progress">
      <span id="progress-text">Lesson 1 of 6</span>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </header>
  <main>
    <aside>
      <div class="lesson-list" id="lesson-list"></div>
    </aside>
    <div class="editor-panel">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div id="editor-container"></div>
      <div id="preview-panel" aria-label="Code preview"></div>
      <div class="output-panel" id="output-panel">
        <div class="output-header">
          <span>Console Output</span>
          <button class="btn btn-secondary" id="clear-output">Clear</button>
        </div>
        <div class="output-content" id="output-content"></div>
      </div>
    </div>
    <div class="lesson-content" id="lesson-content"></div>
  </main>
  <div class="action-bar">
    <button class="btn btn-primary" id="run-btn"><span class="keybinding">Ctrl+Enter</span> Run Code</button>
    <button class="btn btn-secondary" id="reset-btn">Reset Files</button>
    <button class="btn btn-success" id="verify-btn" disabled>Verify Solution</button>
    <button class="btn btn-primary" id="next-btn" disabled>Next Lesson</button>
  </div>
  <script src="./vendor/monaco/vs/loader.js"></script>
  <script src="./app.js"></script>

</body>
</html>
